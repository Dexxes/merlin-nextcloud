# Keeps GitHub Actions and the dependency ranges up to date (weekly, grouped
# so each ecosystem opens at most one pull request per week).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directories: ["/nextcloud", "/core", "/nextcloud/tests"]
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/frontend", "/nextcloud/tests/e2e"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Held back by peer ranges of the Nextcloud tooling: @nextcloud/vite-config
      # wants vite ^7, @nextcloud/stylelint-config wants stylelint ^17. Lift
      # once those packages release versions that accept the new majors.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stylelint"
        update-types: ["version-update:semver-major"]
