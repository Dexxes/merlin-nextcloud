# Checks for every pull request and every push to main. Tests in a real
# Nextcloud (all supported versions, databases, Docker, browser) are in
# nextcloud.yml.
#
# Layout (see STRUCTURE.md): nextcloud/ is the Nextcloud app, frontend/ the
# Vue source that builds into nextcloud/js and nextcloud/css, core/ the
# framework-free PHP core (composer package merlin/core), standalone/ the
# server without Nextcloud, content-filters/ the bundled content filters
# shared by all variants and tools/ the checks across variants.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest and highest PHP of appinfo/info.xml.
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: |
          find nextcloud core standalone tools -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          php -l standalone/bin/merlin > /dev/null

  core-boundary:
    name: Core stays framework-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No Nextcloud or app imports in core/
        # core/ is shared with the standalone server: no OCP\, no OCA\ and no
        # Merlin\Standalone\ references (imports, FQCNs, type hints).
        run: |
          if grep -rnE '(^|[^A-Za-z0-9_])\\?(OCP|OCA|Merlin\\Standalone)\\' core --include='*.php' \
               | grep -vE '^[^:]+:[0-9]+:\s*(\*|//|/\*)'; then
            echo "::error::core/ must not depend on Nextcloud (OCP/OCA) or the standalone server"
            exit 1
          fi
      - name: No Nextcloud imports in standalone/
        run: |
          if grep -rnE '(^|[^A-Za-z0-9_])\\?(OCP|OCA)\\' standalone --include='*.php' --exclude-dir=vendor \
               | grep -vE '^[^:]+:[0-9]+:\s*(\*|//|/\*)'; then
            echo "::error::standalone/ must not depend on Nextcloud (OCP/OCA)"
            exit 1
          fi

  harnesses:
    name: Test harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, curl, sodium, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: composer install (nextcloud)
        working-directory: nextcloud
        run: composer install --no-dev --no-interaction --no-progress
      - name: composer install (standalone)
        working-directory: standalone
        run: composer install --no-dev --no-interaction --no-progress
      - name: Run all test-*.php harnesses
        # nextcloud/tools, core/tests, standalone/tests and tools/ (schema
        # parity). Offline only: harnesses with a --live mode run without it.
        run: |
          status=0
          for f in nextcloud/tools/test-*.php core/tests/test-*.php standalone/tests/test-*.php tools/test-*.php; do
            echo "::group::$f"
            if php "$f"; then echo "ok $f"; else echo "::error file=$f::$f failed"; status=1; fi
            echo "::endgroup::"
          done
          exit $status

  frontend:
    name: Frontend build and app store tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: npm install
        working-directory: frontend
        # No package-lock.json is committed (see .gitignore).
        run: npm install --no-audit --no-fund
      - name: vite build
        working-directory: frontend
        run: npm run build
      - name: Assemble app store tarball
        working-directory: nextcloud
        run: |
          make build-source
          tar -czf build/artifacts/merlin.tar.gz -C build/artifacts merlin
      - name: Check tarball contents
        working-directory: nextcloud/build/artifacts
        run: |
          for f in merlin/appinfo/info.xml merlin/js/merlin-main.mjs merlin/css/merlin-main.css \
                   merlin/vendor/autoload.php merlin/content-filters/spiegel.de.xml \
                   merlin/vendor/merlin/core/src/ContentFilter/ContentFilterSchema.php \
                   merlin/vendor/merlin/core/src/Extraction/ContentExtractorService.php \
                   merlin/vendor/merlin/core/resources/url-shorteners.json \
                   merlin/CHANGELOG.md merlin/LICENSE merlin/README.md; do
            test -e "$f" || { echo "::error::missing in tarball: $f"; exit 1; }
          done
          for f in merlin/tools merlin/tests merlin/Makefile merlin/src merlin/frontend merlin/vendor/merlin/core/tests; do
            test ! -e "$f" || { echo "::error::must not be in tarball: $f"; exit 1; }
          done
          # The core must be copied into vendor/, a symlink would point outside merlin/.
          if find merlin -type l | grep .; then echo "::error::symlinks in tarball"; exit 1; fi
          grep -qF 'Merlin\\Core\\ContentFilter\\ContentFilterSchema' merlin/vendor/composer/autoload_classmap.php \
            || { echo "::error::merlin/core missing from the composer classmap"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: merlin-appstore-tarball
          path: nextcloud/build/artifacts/merlin.tar.gz
          retention-days: 14
