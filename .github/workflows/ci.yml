# Checks for every pull request and every push to main. Tests in a real
# Nextcloud (all supported versions, databases, Docker, browser) are in
# nextcloud.yml.
#
# Layout (see STRUCTURE.md): nextcloud/ is the Nextcloud app, frontend/ the
# Vue source that builds into nextcloud/js and nextcloud/css, core/ the
# framework-free PHP core (composer package merlin/core), standalone/ the
# server without Nextcloud, content-filters/ the bundled content filters
# shared by all variants and tools/ the checks across variants.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every PHP of appinfo/info.xml (8.6 is the newest).
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: |
          find nextcloud core standalone tools -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          php -l standalone/bin/merlin > /dev/null

  core-boundary:
    name: Core stays framework-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No Nextcloud or app imports in core/
        # core/ is shared with the standalone server: no OCP\, no OCA\ and no
        # Merlin\Standalone\ references (imports, FQCNs, type hints).
        run: |
          if grep -rnE '(^|[^A-Za-z0-9_])\\?(OCP|OCA|Merlin\\Standalone)\\' core --include='*.php' \
               | grep -vE '^[^:]+:[0-9]+:\s*(\*|//|/\*)'; then
            echo "::error::core/ must not depend on Nextcloud (OCP/OCA) or the standalone server"
            exit 1
          fi
      - name: No Nextcloud imports in standalone/
        run: |
          if grep -rnE '(^|[^A-Za-z0-9_])\\?(OCP|OCA)\\' standalone --include='*.php' --exclude-dir=vendor \
               | grep -vE '^[^:]+:[0-9]+:\s*(\*|//|/\*)'; then
            echo "::error::standalone/ must not depend on Nextcloud (OCP/OCA)"
            exit 1
          fi

  harnesses:
    # Keeps the old check name for 8.4 in case branch protection requires it.
    name: ${{ matrix.php == '8.4' && 'Test harnesses' || format('Test harnesses ({0})', matrix.php) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest and highest PHP of appinfo/info.xml. Core and standalone are
        # not bound to a Nextcloud release, so 8.6 is tested here even while
        # no supported Nextcloud accepts it yet.
        php: ['8.4', '8.6']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, curl, sodium, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: composer install (nextcloud)
        working-directory: nextcloud
        run: composer install --no-dev --no-interaction --no-progress
      - name: composer install (standalone)
        working-directory: standalone
        run: composer install --no-dev --no-interaction --no-progress
      - name: Run all test-*.php harnesses
        # nextcloud/tools, core/tests, standalone/tests and tools/ (schema
        # parity). Offline only: harnesses with a --live mode run without it.
        run: |
          status=0
          for f in nextcloud/tools/test-*.php core/tests/test-*.php standalone/tests/test-*.php tools/test-*.php; do
            echo "::group::$f"
            if php "$f"; then echo "ok $f"; else echo "::error file=$f::$f failed"; status=1; fi
            echo "::endgroup::"
          done
          exit $status

  frontend:
    name: Frontend build and app store tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Nextcloud imports only in src/platform/
        run: node frontend/tools/check-platform-imports.mjs
      - name: npm install
        working-directory: frontend
        # No package-lock.json is committed (see .gitignore).
        run: npm install --no-audit --no-fund
      - name: vite build
        working-directory: frontend
        run: npm run build
      - name: Assemble app store tarball
        working-directory: nextcloud
        run: |
          make build-source
          tar -czf build/artifacts/merlin.tar.gz -C build/artifacts merlin
      - name: Check tarball contents
        working-directory: nextcloud/build/artifacts
        run: |
          for f in merlin/appinfo/info.xml merlin/js/merlin-main.mjs merlin/css/merlin-main.css \
                   merlin/vendor/autoload.php merlin/content-filters/spiegel.de.xml \
                   merlin/vendor/merlin/core/src/ContentFilter/ContentFilterSchema.php \
                   merlin/vendor/merlin/core/src/Extraction/ContentExtractorService.php \
                   merlin/vendor/merlin/core/resources/url-shorteners.json \
                   merlin/vendor/merlin/core/src/Api/routes.php \
                   merlin/CHANGELOG.md merlin/LICENSE merlin/README.md; do
            test -e "$f" || { echo "::error::missing in tarball: $f"; exit 1; }
          done
          for f in merlin/tools merlin/tests merlin/Makefile merlin/src merlin/frontend merlin/vendor/merlin/core/tests; do
            test ! -e "$f" || { echo "::error::must not be in tarball: $f"; exit 1; }
          done
          # The core must be copied into vendor/, a symlink would point outside merlin/.
          if find merlin -type l | grep .; then echo "::error::symlinks in tarball"; exit 1; fi
          grep -qF 'Merlin\\Core\\ContentFilter\\ContentFilterSchema' merlin/vendor/composer/autoload_classmap.php \
            || { echo "::error::merlin/core missing from the composer classmap"; exit 1; }
      - name: vite build (Standalone)
        working-directory: frontend
        run: npm run build:standalone
      - name: Standalone pages with the built app
        # test-http.php checks / and /s/{token} against standalone/public/app/.
        run: |
          test -f standalone/public/app/js/merlin-main.mjs && test -f standalone/public/app/css/merlin-public.css
          composer install --no-dev --no-interaction --no-progress --working-dir=standalone
          php standalone/tests/test-http.php
      - name: Assemble standalone tarball
        # Same layout as the Docker image (standalone/tools/assemble.sh).
        run: |
          standalone/tools/assemble.sh build/merlin-standalone
          tar -czf build/merlin-standalone.tar.gz -C build merlin-standalone
      - name: Check standalone tarball contents
        working-directory: build
        run: |
          for f in merlin-standalone/VERSION merlin-standalone/bin/merlin merlin-standalone/public/index.php \
                   merlin-standalone/public/app/js/merlin-main.mjs merlin-standalone/public/img/icon-192.png \
                   merlin-standalone/l10n/de.json merlin-standalone/content-filters/spiegel.de.xml \
                   merlin-standalone/vendor/autoload.php merlin-standalone/vendor/merlin/core/src/Api/routes.php \
                   merlin-standalone/config/config.sample.php merlin-standalone/LICENSE; do
            test -e "$f" || { echo "::error::missing in standalone tarball: $f"; exit 1; }
          done
          for f in merlin-standalone/tests merlin-standalone/docker merlin-standalone/config/config.php \
                   merlin-standalone/vendor/merlin/core/tests; do
            test ! -e "$f" || { echo "::error::must not be in standalone tarball: $f"; exit 1; }
          done
          if find merlin-standalone -type l | grep .; then echo "::error::symlinks in standalone tarball"; exit 1; fi
          test "$(cat merlin-standalone/VERSION)" = "$(sed -n 's#.*<version>\([^<]*\)</version>.*#\1#p' ../nextcloud/appinfo/info.xml | head -n 1)"
      - uses: actions/upload-artifact@v7
        with:
          name: merlin-appstore-tarball
          path: nextcloud/build/artifacts/merlin.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: merlin-standalone-tarball
          path: build/merlin-standalone.tar.gz
          retention-days: 14

  standalone-docker:
    name: Standalone Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -f standalone/Dockerfile -t merlin-standalone:ci .
      - name: Start container
        run: |
          docker run -d --name merlin -p 8080:8080 \
            -e MERLIN_BASE_URL=http://127.0.0.1:8080 \
            -e MERLIN_ADMIN_USER=admin -e MERLIN_ADMIN_EMAIL=admin@example.org \
            -e MERLIN_ADMIN_PASSWORD=ci-password-123 merlin-standalone:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/capabilities > /dev/null && break
            sleep 1
          done
      - name: Smoke test
        run: standalone/docker/smoke-test.sh http://127.0.0.1:8080 admin ci-password-123
      - name: Restart keeps data and secret
        run: |
          docker restart merlin
          sleep 3
          standalone/docker/smoke-test.sh http://127.0.0.1:8080 admin ci-password-123
          docker exec merlin test -s /data/secret
      - name: Container log
        if: always()
        run: docker logs merlin; docker exec merlin cat /data/merlin.log || true
