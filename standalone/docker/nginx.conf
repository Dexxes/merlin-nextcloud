# Merlin Standalone (Docker): alles außer echten Dateien unter public/ geht an
# public/index.php (wie public/.htaccess für Apache).
server {
	listen 8080 default_server;
	server_name _;
	root /var/www/merlin/public;
	client_max_body_size 64m;
	server_tokens off;

	location / {
		try_files $uri /index.php$is_args$args;
	}

	# Die Vue-App lädt ES-Module.
	location ~ \.mjs$ {
		types { }
		default_type text/javascript;
		try_files $uri /index.php$is_args$args;
	}

	location = /index.php {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root/index.php;
		fastcgi_param HTTP_PROXY "";
		fastcgi_pass 127.0.0.1:9000;
		# Server-Sent Events (/api/events, /s/{token}/events) ohne Puffer.
		fastcgi_buffering off;
		fastcgi_read_timeout 180s;
	}

	location ~ \.php$ {
		return 404;
	}

	location ~ /\. {
		return 404;
	}
}
