; Merlin Standalone (Docker): Pool "www" aus dem Basis-Image.
[global]
error_log = /proc/self/fd/2

[www]
; Die Konfiguration liest MERLIN_* aus der Umgebung.
clear_env = no
; Ein offener Reader hält während der Extraktion einen Prozess für /api/events
; (höchstens 60 Sekunden), daher mehr als die Vorgabe 5.
pm = dynamic
pm.max_children = ${MERLIN_PHP_WORKERS}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
catch_workers_output = yes
decorate_workers_output = no
